<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote Restaurant - Premium</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>
    <div class="overlay">
        <div class="header">
            <h1>Choisissez notre restaurant</h1>
            <p>Saisissez votre prénom, faites votre choix (max 5 participants).</p>
            <p class="share-link" id="share-link-container" style="display:none;">
                Lien à partager : <br><a href="#" id="share-link" target="_blank"></a>
            </p>
            <div class="user-input">
                <input type="text" id="username" placeholder="Votre prénom..." maxlength="20">
            </div>
        </div>
        <div class="restaurants" id="restaurants-list">
            <!-- Populated by JS -->
        </div>
    </div>
    
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
