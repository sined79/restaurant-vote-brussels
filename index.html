<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote: Restaurants Bruxelles</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Où mangeons-nous aujourd'hui ?</h1>
        <p>Choisissez votre restaurant préféré parmi notre sélection à Bruxelles.</p>
    </header>

    <main>
        <section class="map-container">
            <div id="map"></div>
        </section>

        <section class="voting-section">
            <div class="user-input-container">
                <input type="text" id="voter-name" placeholder="Entrez votre prénom..." autocomplete="off">
                <p class="max-voters-notice">Maximum 5 personnes peuvent voter.</p>
            </div>

            <div class="restaurants-grid" id="restaurants-grid">
                <!-- Les cartes des restaurants seront générées ici par JS -->
            </div>
            
            <div class="status-message" id="status-message"></div>
        </section>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
